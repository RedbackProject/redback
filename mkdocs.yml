site_name: REDBACK Documentation
site_description: Rock mEchanics with Dissipative feedBACKs - A MOOSE application
repo_url: https://github.com/RedbackProject/redback
repo_name: RedbackProject/redback

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - toc.follow

plugins:
  - search

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Theory: theory.md
  - Examples: examples.md
  - Contributing: contributing.md

markdown_extensions:
- attr_list
- pymdownx.highlight
- pymdownx.superfences
- pymdownx.inlinehilite
- pymdownx.arithmatex:
    generic: true
- admonition
- toc:
    permalink: true

extra_javascript:
- javascripts/mathjax.js
- https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
